name: Python Test, Build and Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest python-dotenv asgiref

      - name: Run pytest
        run: |
          python -m pytest tests/ -v

  build-and-run:
    name: Build and Prepare Run
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Create virtual environment and install wheel
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install dist/*.whl

      - name: Install Flaskr from examples/tutorial
        run: |
          source venv/bin/activate
          python -m pip install --no-deps -e ./examples/tutorial

      - name: Initialize Flaskr database
        run: |
          source venv/bin/activate
          python -m flask --app flaskr init-db

      - name: Run Flaskr application
        run: |
          source venv/bin/activate
          python -m flask --app flaskr run --host=0.0.0.0 --port=5000 &
          sleep 3
          curl -f http://localhost:5000