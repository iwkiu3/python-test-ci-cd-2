name: CI/CD Pipeline

# 2) Запуск при пуше и PR в main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 3) Job для тестов с матрицей Python
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Важно: чтобы ошибка в 3.11 не отменяла запуск 3.12
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем проект и зависимости для тестов
          pip install -e ".[test]" 
          # Если нет группы [test], просто: pip install -e . && pip install pytest

      - name: Run tests
        run: |
          pytest tests/ -v

  # 4) Job build-and-run (запускается только после успеха всех тестов)
  build-and-run:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package (.whl and .tar.gz)
        run: |
          python -m build

      - name: Create venv and install wheel
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install dist/*.whl

      - name: Install Flaskr example
        run: |
          source venv/bin/activate
          # Предполагаем, что flaskr находится в examples/tutorial
          pip install -e examples/tutorial/

      - name: Init DB
        run: |
          source venv/bin/activate
          export FLASK_APP=flaskr
          flask init-db

      - name: Run App on port 5000
        run: |
          source venv/bin/activate
          export FLASK_APP=flaskr
          # Запускаем и проверяем доступность
          flask run --host=0.0.0.0 --port=5000 &
          sleep 5
          curl http://localhost:5000 || exit 1