name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # версии Python запускаются независимо друг от друга
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip # кэш pip ускоряет установку зависимостей

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ставим проект и зависимости для тестов
          pip install -e ".[test]" || pip install -e .
          # Werkzeug НЕ закрепляем: Flask использует set_cookie(partitioned=...),
          # который есть только в Werkzeug >= 3.1
          pip install pytest asgiref

      - name: Run tests
        run: pytest tests/ -v

  build-and-run:
    name: Build and Run
    needs: test # запускается только после успешных тестов
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package (.whl and .tar.gz)
        run: python -m build

      - name: Create venv and install wheel
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install dist/*.whl

      - name: Install Flaskr example
        run: |
          source venv/bin/activate
          pip install -e examples/tutorial/

      - name: Initialize database
        run: |
          source venv/bin/activate
          export FLASK_APP=flaskr
          flask init-db

      - name: Run app and smoke test
        run: |
          source venv/bin/activate
          export FLASK_APP=flaskr

          flask run --host=0.0.0.0 --port=5000 &
          SERVER_PID=$!
          # Останавливаем сервер при любом выходе из шага (успех или ошибка)
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Ждём старта сервера: до 15 попыток с паузой в 1 секунду
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000 > /dev/null; then
              echo "App is up after $i attempt(s)"
              exit 0
            fi
            sleep 1
          done

          echo "App did not respond in time"
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
